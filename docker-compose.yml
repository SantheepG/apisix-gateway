services:

  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: apisix-etcd
    command:
      - /usr/local/bin/etcd
      - --name=etcd0
      - --advertise-client-urls=http://0.0.0.0:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd-data
    ports:
      - "2379:2379"
    volumes:
      - etcd_data:/etcd-data
    networks:
      - api-network

  apisix:
    image: apache/apisix:3.14.1-debian
    container_name: apisix
    depends_on:
      - etcd
    ports:
      - "9080:9080"
      - "9443:9443"
      - "9180:9180"
    volumes:
      - ./config.yaml:/usr/local/apisix/conf/config.yaml:ro
    networks:
      - api-network

volumes:
  etcd_data:

networks:
  api-network:
    driver: bridge